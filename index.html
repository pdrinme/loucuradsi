<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Meu DSi</title>
<style type="text/css">
body { margin: 0; padding: 6px; background: #e8f0ff; color: #222; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
h1 { margin: 0 0 6px 0; padding: 6px; background: #2a6fdb; color: #fff; font-size: 18px; text-align: center; }
h2 { margin: 10px 0 4px 0; font-size: 15px; color: #1a4a99; border-bottom: 2px solid #2a6fdb; }
p { margin: 4px 0; line-height: 1.3; }
.box { background: #fff; border: 2px solid #2a6fdb; padding: 6px; margin-bottom: 8px; }
.menu a { display: block; margin: 4px 0; padding: 8px; background: #ffd23f; color: #222; border: 2px solid #c79a00; text-decoration: none; font-weight: bold; text-align: center; }
.small { font-size: 11px; color: #555; text-align: center; margin-top: 8px; }
#relogio { font-size: 26px; font-weight: bold; text-align: center; color: #1a4a99; }
</style>
</head>
<body>

<h1>Meu DSi</h1>

<div class="box">
  <p>Olá! Esta é a minha página no Nintendo DSi.</p>
  <div id="relogio">--:--:--</div>
</div>

<h2>Atalhos</h2>
<div class="menu">
  <a href="http://www.google.com/">Pesquisar</a>
  <a href="http://pt.wikipedia.org/">Wikipédia</a>
  <a href="http://www.gamefaqs.com/">Dicas de jogos</a>
</div>

<h2>Anotações</h2>
<div class="box">
  <p>- Jogar Mario Kart DS</p>
  <p>- Carregar a bateria</p>
  <p>- Tirar fotos com a câmera</p>
</div>

<p class="small">Feito para o navegador do DSi</p>

<script type="text/javascript">
function dois(n) { return (n < 10 ? "0" : "") + n; }
function atualizar() {
  var d = new Date();
  var el = document.getElementById("relogio");
  if (el) { el.innerHTML = dois(d.getHours()) + ":" + dois(d.getMinutes()) + ":" + dois(d.getSeconds()); }
}
atualizar();
setInterval(atualizar, 1000);
</script>

</body>
</html>
